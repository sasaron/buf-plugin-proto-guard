syntax = "proto3";

package acme.app.v1;

import "acme/option/v1/sensitive.proto";
import "acme/shared/v1/shared.proto";
import "google/protobuf/timestamp.proto";

message Address {
  string prefecture = 1;
  string line = 2 [(acme.option.v1.sensitive) = true];
  string memo = 3 [(acme.option.v1.sensitive) = false];
}

message Customer {
  string id = 1;
  Address address = 2;
  Customer referrer = 3;
}

message ShipPayload {
  string order_id = 1;
  Customer customer = 2;
  google.protobuf.Timestamp created_at = 3;
}

message TagPayload {
  map<string, Address> addresses = 1;
}

message Batch {
  message ItemPayload {
    acme.shared.v1.Note note = 1;
  }
}

message CleanPayload {
  string order_id = 1;
}
